<div class="col-xl-12 pt-3">
    <div class="card custom-card">
        <div class="card-header justify-content-between">
            <div class="card-title col-md-2 col-xl-6 col-xxl-6 col-lg-6 col-sm-3">All Campaigns</div>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-primary btn-wave" data-bs-toggle="offcanvas"
                        (click)="open(content7)" data-bs-target="#offcanvasRight"
                        aria-controls="offcanvasRight">Create Campaign</button>
                <button class="btn btn-primary" >
                    Show More
                </button>
            </div>
        </div>
    </div>
    <div class="col-xxl-12">
        <div class="row">
            <div class="col-xxl-3 col-lg-3 col-md-3 col-xl-3 col-sm-6" >
                <div class="card custom-card">
                    <div class="card-header d-flex align-items-center justify-content-between">
                        <div class="me-2  align-items-center">
                            <span class="avatar avatar-rounded p-1 bg-light">
                                <img src="./assets/images/brand-logos/profile1.jpg" alt="">
                            </span>
                        </div>
                        <div class="flex-fill">
                            <a href="javascript:void(0);" class="fs-14 d-block text-truncate project-list-title">
                                Campaign Name: Vcs</a>
                            <span class="text-muted d-block fs-12">Managing Person: Tarun</span>
                            <div class="avatar-list-stacked">
                                <span class="avatar avatar-sm avatar-rounded">
                                    <img src="./assets/images/faces/1.jpg" alt="img">
                                </span>
                                <span class="avatar avatar-sm avatar-rounded">
                                    <img src="./assets/images/faces/2.jpg" alt="img">
                                </span>
                                <span class="avatar avatar-sm avatar-rounded">
                                    <img src="./assets/images/faces/8.jpg" alt="img">
                                </span>
                                <span class="avatar avatar-sm avatar-rounded">
                                    <img src="./assets/images/faces/12.jpg" alt="img">
                                </span>
                                <span class="avatar avatar-sm avatar-rounded">
                                    <img src="./assets/images/faces/10.jpg" alt="img">
                                </span>
                                <a class="avatar avatar-sm bg-primary avatar-rounded text-fixed-white"
                                    href="javascript:void(0);">
                                    +8
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="mb-1">Total Leads : <span class="badge bg-info-transparent">900 +</span></div>
                        <div>
                            <div></div>
                            <div class="progress progress-xs progress-animate" role="progressbar" aria-valuenow="80"
                                aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar bg-primary" style="width: 80%"></div>
                            </div>
                            <div class="mt-1"><span class="text-primary fw-medium">80%</span> Completed</div>
                        </div>
                        <div class="mb-1 pt-3">Total In Progress : <span class="badge bg-success-transparent">140 +</span></div>
                        <div>
                            <div></div>
                            <div class="progress progress-xs progress-animate" role="progressbar" aria-valuenow="80"
                                aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar bg-success" style="width: 80%"></div>
                            </div>
                            <div class="mt-1"><span class="text-danger fw-medium">20%</span> Completed</div>
                        </div>
                        <div class="mb-1 pt-3">Total Closed : <span class="badge bg-danger-transparent">10 +</span></div>
                        <div>
                            <div></div>
                            <div class="progress progress-xs progress-animate" role="progressbar" aria-valuenow="80"
                                aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar bg-danger" style="width: 80%"></div>
                            </div>
                            <div class="mt-1"><span class="text-primary fw-medium">10%</span> Completed</div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <a class="btn btn-sm btn-primary btn-wave ms-3" routerLink="/apps/crm/leads">
                            <i class="ri-eye-line me-2"></i>View
                          </a>                          
                        <a class="btn btn-sm btn-primary btn-wave me-3"><i
                                class="ri-delete-bin-line me-2"></i>Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="create-contact" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <ng-template #content7 let-c="close" let-d="dismiss">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">Create New Campaign</h6>
                <button type="button" class="btn-close" (click)="d('Cross click')" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body px-4">
                <div class="row gy-3">
                    <div class="col-xl-6">
                        <label for="deal-name" class="form-label">Campaign Name</label>
                        <input type="text" class="form-control" id="deal-name" placeholder="Contact Name">
                    </div>
                    <div class="col-xl-6">
                        <label for="deal-name" class="form-label">Pipeline</label>
                        <ng-select formControlName="pipeLine" [items]="pipeLine" bindLabel="name" bindValue="name"
                        placeholder="Select an option">
                    </ng-select>
                    </div>
                    <div class="col-xl-12">
                        <label for="deal-name" class="form-label">Who will managing this Campaign</label>
                        <input type="text" class="form-control" id="deal-name" placeholder="Contact Name">
                    </div>
                    <div class="col-xl-12">
                        <label for="deal-name" class="form-label">Select Agents</label>
                        <ng-select placeholder="Multiple Select" class="js-example-placeholder-multiple js-states"
                            [multiple]="true">
                            <ng-option value="fr-1">Appple</ng-option>
                            <ng-option value="fr-2">Mango</ng-option>
                            <ng-option value="fr-3">Orange</ng-option>
                            <ng-option value="fr-4">Guava</ng-option>
                            <ng-option value="fr-5">Pineapple</ng-option>
                        </ng-select>
                    </div>
                    <div class="col-xl-6">
                        <label for="deal-name" class="form-label">Campaign Priority</label>
                        <input type="text" class="form-control" id="deal-name" placeholder="Contact Name">
                    </div>
                    <div class="col-xl-6">
                        <label for="deal-name" class="form-label">Lead Duplicacy</label>
                        <input type="text" class="form-control" id="deal-name" placeholder="Contact Name">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light"
                    data-bs-dismiss="modal"  (click)="c('Cancel click')">Cancel</button>
                <button type="button" class="btn btn-primary">Create Campaign</button>
            </div>
        </div>
    </ng-template>
    </div>
</div>
