<div class="col-lg-12 col-xxl-12 pt-2">
  <div class="card custom-card">
      <div class="card-header justify-content-between">
        <div class="card-title col-md-2 col-xl-6 col-xxl-6 col-lg-6 col-sm-3">Users</div>
        <div class="text-center">
            <button type="button" class="btn btn-outline-primary btn-wave">Add New</button>
        </div>
      </div>
      <div class="card-body p-0">
            <!-- <mat-form-field class="m-1 mat-filter">
              <mat-label>Filter</mat-label>
              <input matInput (keyup)="applyFilter($event)" #input>
          </mat-form-field> -->
                <div class="mat-elevation-z8">
                  <table mat-table [dataSource]="dataSource">
                      <ng-container matColumnDef="slNo" [sticky]="true" class=" mat-elevation-z8">
                          <th mat-header-cell *matHeaderCellDef> S.No. </th>
                          <td mat-cell *matCellDef="let element; let i = index"> {{getSNo(i)}} </td>
                      </ng-container>
                      <ng-container matColumnDef="firstName" [sticky]="true">
                        <th mat-header-cell *matHeaderCellDef> firstName </th>
                        <td mat-cell *matCellDef="let element"> {{element.firstName}} </td>
                    </ng-container> 
                      <ng-container matColumnDef="email" [sticky]="true">
                        <th mat-header-cell *matHeaderCellDef> email</th>
                        <td mat-cell *matCellDef="let element"> {{element.email }} </td>
                    </ng-container>
                    
                    <ng-container matColumnDef="country" [sticky]="true">
                        <th mat-header-cell *matHeaderCellDef> country </th>
                        <td mat-cell *matCellDef="let element"> {{element.country}} </td>
                    </ng-container>  
                    <ng-container matColumnDef="phone" [sticky]="true">
                        <th mat-header-cell *matHeaderCellDef> phone </th>
                        <td mat-cell *matCellDef="let element"> {{element.phone }} </td>
                    </ng-container>
                    <ng-container matColumnDef="crmActivityStatus" [sticky]="true">
                        <th mat-header-cell *matHeaderCellDef> Status </th>
                        <td mat-cell *matCellDef="let element"> {{element.crmActivityStatus }} </td>
                    </ng-container>
                    <ng-container matColumnDef="city" [sticky]="true">
                        <th mat-header-cell *matHeaderCellDef> city </th>
                        <td mat-cell *matCellDef="let element"> {{element.city }} </td>
                    </ng-container>
                      
                      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                  </table>
              </div>
              <mat-paginator #paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons
                  aria-label="Select page of periodic elements">
              </mat-paginator>
          
      </div>
      
  </div>
</div>
