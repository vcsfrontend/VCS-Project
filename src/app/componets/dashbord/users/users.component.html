<div class="col-lg-12 col-xxl-12 pt-2">
  <div class="card custom-card">
      <div class="card-header justify-content-between">
          <div class="card-title">
              <h4>Users </h4> 
          </div>
          <div class="btn-group" role="group" aria-label="Basic example">
            <div class="demo-checkbox" style="font-size: 14px; margin-right: 25px; margin-top: 5px;">
              <input type="checkbox" id="show_active_users" class="margin-right">
              <label for="show_active_users" style="text-transform:capitalize;"> Show Only Active users</label>
            </div>
            <button type="button" class="btn btn-outline-primary waves-effect">Hierarchy Tree</button>
            <button type="button" class="btn btn-outline-primary waves-effect">Bulk Upload</button>
            <button type="button" class="btn btn-outline-primary waves-effect">Add New</button>
          </div>
      </div>
      <div class="card-body p-0">
          
            <mat-form-field class="m-1 mat-filter">
              <mat-label>Filter</mat-label>
              <input matInput (keyup)="applyFilter($event)" #input>
          </mat-form-field>
          
              
                <div class="mat-elevation-z8">
                  <table mat-table [dataSource]="dataSource" matSort>
                      <ng-container matColumnDef="slNo"  class=" mat-elevation-z8">
                          <th mat-header-cell *matHeaderCellDef> S.No. </th>
                          <td mat-cell *matCellDef="let element; let i = index"> {{getSNo(i)}} </td>
                      </ng-container>
                      <ng-container matColumnDef="id" >
                        <th mat-header-cell *matHeaderCellDef> ID </th>
                        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                    </ng-container> 
                      <ng-container matColumnDef="name" >
                          <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                          <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                      </ng-container>    
                      <ng-container matColumnDef="userId" >
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> User Id</th>
                        <td mat-cell *matCellDef="let element"> {{element.userId }} </td>
                    </ng-container>
                      <ng-container matColumnDef="email" >
                          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
                          <td mat-cell *matCellDef="let element"> {{element.email }} </td>
                      </ng-container>
                      <ng-container matColumnDef="reporting_to" >
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Reporting To</th>
                        <td mat-cell *matCellDef="let element"> {{element.reporting_to }} </td>
                    </ng-container>
                    <ng-container matColumnDef="status" >
                      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
                      <td mat-cell *matCellDef="let element"> {{element.status }} </td>
                  </ng-container>

                  <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef> Actions </th>
                    <td mat-cell *matCellDef="let element">                     
                
                      <!-- Vertical Dot Icon (Menu) -->
                      <button mat-icon-button [matMenuTriggerFor]="menu">
                        <mat-icon>more_vert</mat-icon>
                      </button>
                
                      <!-- Menu Options -->
                      <mat-menu #menu="matMenu">
                        <button mat-menu-item (click)="view(element)" class="view-option">View Details</button>
                        <button mat-menu-item (click)="view(element)" class="ban-option">Ban User</button>
                        <button mat-menu-item (click)="delete(element)" class="delete-option">Delete</button>
                      </mat-menu>
                      <!-- Edit Icon -->
                      <button mat-icon-button (click)="edit(element)">
                        <mat-icon>edit</mat-icon>
                      </button>

                    </td>
                  </ng-container>
                      
                      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                  </table>
              </div>
              <mat-paginator #paginator [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 20]" (page)="pageEvent($event)" showFirstLastButtons
                  aria-label="Select puserId of periodic elements">
              </mat-paginator>
          
      </div>
      
  </div>
</div>
