<div class=" multi-step-form mt-2 col-xl-12 col-xxl-12 col-md-12 col-lg-12 col-sm-12">
<div class="card custom-card ">
    <div class="card-header justify-content-between">

        <div class="row">
            <div class="card-body col-xxl-12 col-xl-12 col-md-12 col-lg-12 col-sm-12 ">
                <form [formGroup]="optimizeFormSample" (ngSubmit)="submitForm()">
                    <!-- Step 1 -->
                    <div *ngIf="stepIndex === 1">
                        <h4>Step 1: Saw</h4>
                        <div formGroupName="saw" class="row">
                            <div class="col-xl-3 col-auto">
                                <label for="BladeWidth" class="form-label my-2">Blade Width</label>
                                <input type="number" class="form-control" id="bladeWidth"
                                    formControlName="bladeWidth" placeholder="kerf of the blade">
                            </div>
                            <div class="col-xl-3 col-auto">
                                <label for="task-name" class="form-label my-2">StockType</label>
                                <ng-select formControlName="stockType" [items]="stockType" bindLabel="name"
                                    bindValue="name" placeholder="The type of stock">
                                </ng-select>
                            </div>
                            <div class="col-xl-3 col-auto">
                                <label for="task-name" class="form-label my-2">CutType</label>
                                <ng-select formControlName="cutType" [items]="cutType" bindLabel="name"
                                    bindValue="name" placeholder="The cut type">
                                </ng-select>
                            </div>
                            <div class="col-xl-3 col-auto">
                                <label for="task-name" class="form-label my-2">CutPreference</label>
                                <ng-select formControlName="cutPreference" [items]="cutPreference" bindLabel="name"
                                    bindValue="name" placeholder="Required for guillotine & beam cutType">
                                </ng-select>
                            </div>
                            <div formGroupName="guillotineOptions" class="row">
                                <div class="card-title my-2">
                                    guillotineOptions
                                </div>
                                <div class="col-xl-3 col-auto">
                                    <label class="form-label my-2">Cutting Strategy</label>
                                    <ng-select [items]="strategy" bindLabel="name" bindValue="name"
                                        placeholder="The guillotine cutting strategy" formControlName="strategy">
                                    </ng-select>
                                </div>
                                <div class="col-xl-3">
                                    <label class="form-label my-2">MaxPhase</label>
                                    <input type="number" class="form-control" id="maxPhase"
                                        placeholder="guillotine or beam cutType" formControlName="maxPhase">
                                </div>
                            </div>
                            <div formGroupName="efficiencyOptions" class="row">
                                <div class="card-title my-2">
                                    EfficiencyOptions
                                </div>
                                <div class="col-xl-3">
                                    <label class="form-label my-2">primary Compression</label>
                                    <input type="text" class="form-control" id="primarycompression"
                                        placeholder="The stacking preference for the parts"
                                        formControlName="primaryCompression">
                                </div>
                            </div>
                            <div class="col-xl-3">
                                <label class="form-label my-2">stackHeight</label>
                                <input type="number" class="form-control" id="stackHeight"
                                    placeholder="the max stack height for your saw" formControlName="stackHeight">
                            </div>
                            <div formGroupName="options" class="row">
                                <div class="card-title my-2">
                                    Options
                                </div>
                                <div class="col-xl-3">
                                    <label class="form-label my-2">StockSelection</label>
                                    <ng-select [items]="StockSelection" bindLabel="name" bindValue="name"
                                        placeholder="Choose the most efficient stock,"
                                        formControlName="stockSelection">
                                    </ng-select>
                                </div>
                                <div class="col-xl-3">
                                    <label class="form-label my-2">minSpacing</label>
                                    <input type="number" class="form-control" id="minSpacing"
                                        placeholder="Set the minimum gap between parts & edges"
                                        formControlName="minSpacing">
                                </div>
                                <div class="col-xl-3">
                                    <label class="form-label my-2">stackingMode</label>
                                    <ng-select [items]="stackingMode" bindLabel="name" bindValue="name"
                                        placeholder="Set the stock stacking mode." formControlName="stackingMode">
                                    </ng-select>
                                </div>
                            </div>
                        </div>
                        <button type="button" (click)="nextStep(2)">Next</button>
                    </div>

                    <!-- Step 2 -->
                    <div *ngIf="stepIndex === 2">
                        <div class="row">
                            <div class="col-xl-12 pt-3">
                                <div class="card custom-card">
                                    <div class="card-header justify-content-between">
                                        <h4>Step 2: Stock</h4>
                                        <div class="text-center">
                                            <button type="button" class="btn btn-primary" (click)="addStock()">Add
                                                Stock</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div formArrayName="stock">
                            <div *ngFor="let stockGroup of stock.controls; let i = index" [formGroupName]="i"
                                class="row mt-5">
                                <div class="col-xl-3 col-auto">
                                    <label for="name" class="form-label my-2">Stock Name</label>
                                    <input type="text" class="form-control" placeholder="stock name"
                                        formControlName="name">
                                </div>
                                <div class="col-xl-3 col-auto">
                                    <label for="task-name" class="form-label my-2">Length</label>
                                    <input type="number" class="form-control"
                                        placeholder="enter the length of the stock" formControlName="l">
                                </div>
                                <div class="col-xl-3 col-auto">
                                    <label for="w" class="form-label my-2">Width</label>
                                    <input type="number" class="form-control"
                                        placeholder="enter the width of the stock" formControlName="w">
                                </div>
                                <div class="col-xl-3 col-auto">
                                    <label for="t" class="form-label my-2">Thickness</label>
                                    <input type="number" class="form-control"
                                        placeholder="enter the Thickness of the stock" formControlName="t">
                                </div>
                                <div class="col-xl-3 col-auto">
                                    <label for="material" class="form-label my-2">Material</label>
                                    <input type="text" class="form-control"
                                        placeholder="A material reference, used for stock matching"
                                        formControlName="material">
                                </div>
                                <div class="col-xl-3">
                                    <label for="q" class="form-label my-2">Quantity</label>
                                    <input type="number" class="form-control"
                                        placeholder="The quantity of this stock" formControlName="q">
                                </div>
                                <div class="col-xl-3">
                                    <label class="form-label my-2">autoAdd</label>
                                    <ng-select [items]="autoAdd" bindLabel="name" bindValue="name"
                                        placeholder="Whether to automatically add or not" formControlName="autoAdd">
                                    </ng-select>
                                </div>
                                <div class="col-xl-3">
                                    <label class="form-label my-2">Grain</label>
                                    <ng-select [items]="Grain" bindLabel="name" bindValue="name"
                                        placeholder="select" formControlName="grain">
                                    </ng-select>
                                </div>
                                <div formGroupName="trim" class="row">
                                    <div class="card-title my-2">
                                        Trim
                                    </div>
                                    <div class="col-xl-3">
                                        <label class="form-label my-2">Apply trim to the Right side</label>
                                        <input type="number" class="form-control"
                                            placeholder="Apply trim to the X1 side" formControlName="x1">
                                    </div>
                                    <div class="col-xl-3">
                                        <label class="form-label my-2">Apply trim to the left side</label>
                                        <input type="number" class="form-control"
                                            placeholder="Apply trim to the X2 side" formControlName="x2">
                                    </div>
                                    <div class="col-xl-3">
                                        <label class="form-label my-2">Apply trim to the Top side</label>
                                        <input type="number" class="form-control"
                                            placeholder="Apply trim to the Y1 side" formControlName="y1">

                                    </div>
                                    <div class="col-xl-3">
                                        <label class="form-label my-2">Apply trim to the Bottom side</label>
                                        <input type="number" class="form-control"
                                            placeholder="Apply trim to the Y2 side" formControlName="y2">

                                    </div>
                                </div>
                                <div class="col-xl-4">
                                    <label class="form-label my-2">allowExactFitShapes</label>
                                    <ng-select [items]="allowExactFitShapes" bindLabel="name" bindValue="name"
                                        placeholder="should exact fit shapes be allowed on this stock"
                                        formControlName="allowExactFitShapes">
                                    </ng-select>
                                </div>
                                <div class="col-xl-4">
                                    <label class="form-label my-2">material cost</label>
                                    <input type="number" class="form-control" placeholder="The raw material cost"
                                        formControlName="cost">
                                </div>
                                <div class="col-xl-4">
                                    <label class="form-label my-2">notes</label>
                                    <input type="text" class="form-control" id="notes" placeholder="notes"
                                        formControlName="notes">
                                </div>

                            </div>
                        </div>

                        <button type="button" (click)="prevStep(1)">Back</button>
                        <button type="button" (click)="nextStep(3)">Next</button>
                    </div>

                    <!-- Step 3 -->
                    <div *ngIf="stepIndex === 3">
                        <div class="row">
                            <div class="col-xl-12 pt-3">
                                <div class="card custom-card">
                                    <div class="card-header justify-content-between">
                                        <h4>Step 3: Parts</h4>
                                        <div class="text-center">
                                            <button type="button" class="btn btn-primary" (click)="addParts()">Add
                                                Part</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div formArrayName="parts">
                            <div *ngFor="let partGroup of parts.controls; let i = index" [formGroupName]="i"
                                class="row mt-5">
                                <div class="col-xl-3 col-auto">
                                    <label for="task-name" class="form-label my-2">Part Name</label>
                                    <input type="text" class="form-control" id="task-name"
                                        placeholder="Name of this part" formControlName="name">
                                </div>
                                <div class="col-xl-3 col-auto">
                                    <label for="task-name" class="form-label my-2">length of this part</label>
                                    <input type="number" class="form-control" id="task-name"
                                        placeholder="length of this part" formControlName="l">
                                </div>
                                <div class="col-xl-3 col-auto">
                                    <label for="task-name" class="form-label my-2">Width of this part</label>
                                    <input type="number" class="form-control" id="task-name"
                                        placeholder="Width of this part" formControlName="w">
                                </div>

                                <div class="col-xl-3 col-auto">
                                    <label for="task-name" class="form-label my-2">Thickness of this part</label>
                                    <input type="number" class="form-control" id="task-name"
                                        placeholder="Thickness of this part" formControlName="t">
                                </div>
                                <div class="col-xl-3 col-auto">
                                    <label for="task-name" class="form-label my-2">material</label>
                                    <input type="text" class="form-control" id="task-name"
                                        placeholder="Material reference for stock matching"
                                        formControlName="material">
                                </div>
                                <div class="col-xl-3 col-auto">
                                    <label for="task-name" class="form-label my-2">quantity of this part</label>
                                    <input type="number" class="form-control" id="task-name"
                                        placeholder="The quantity of this part" formControlName="q">
                                </div>
                                <div formGroupName="banding" class="row">
                                    <div class="card-title my-2">
                                        banding
                                    </div>
                                    <div class="col-xl-3">
                                        <label class="form-label my-2">Apply banding to the Right side</label>
                                        <ng-select [items]="X1" bindLabel="name" bindValue="name"
                                            placeholder="Apply banding to the Right side" formControlName="x1">
                                        </ng-select>
                                    </div>
                                    <div class="col-xl-3 col-auto">
                                        <label for="task-name" class="form-label my-2">Apply banding to the left
                                            side</label>
                                        <ng-select [items]="X2" bindLabel="name" bindValue="name"
                                            placeholder="Apply banding to the left side" formControlName="x2">
                                        </ng-select>
                                    </div>
                                    <div class="col-xl-3 col-auto">
                                        <label for="task-name" class="form-label my-2">Apply banding to the Top
                                            side</label>
                                        <ng-select [items]="Y1" bindLabel="name" bindValue="name"
                                            placeholder="Apply banding to the Top side" formControlName="y1">
                                        </ng-select>
                                    </div>
                                    <div class="col-xl-3 col-auto">
                                        <label for="task-name" class="form-label my-2">Apply banding to the Bottom
                                            side</label>
                                        <ng-select [items]="Y2" bindLabel="name" bindValue="name"
                                            placeholder="Apply banding to the Bottom side" formControlName="y2">
                                        </ng-select>
                                    </div>
                                </div>
                                <div formGroupName="trim" class="row">
                                    <div class="card-title my-2">
                                        trim
                                    </div>
                                    <div class="col-xl-3 col-auto">
                                        <label for="task-name" class="form-label my-2">Apply Trim to the Right
                                            side</label>
                                        <input type="number" class="form-control" id="task-name"
                                            placeholder="Apply Trim to the Right side" formControlName="x1">
                                    </div>
                                    <div class="col-xl-3 col-auto">
                                        <label for="task-name" class="form-label my-2">Apply Trim to the Left
                                            side</label>
                                        <input type="number" class="form-control" id="task-name"
                                            placeholder="Apply Trim to the Left side" formControlName="x2">
                                    </div>
                                    <div class="col-xl-3 col-auto">
                                        <label for="task-name" class="form-label my-2">Apply Trim to the Top
                                            side</label>
                                        <input type="number" class="form-control" id="task-name"
                                            placeholder="Apply Trim to the Top side" formControlName="y1">
                                    </div>
                                    <div class="col-xl-3 col-auto">
                                        <label for="task-name" class="form-label my-2">Apply Trim to the Bottom
                                            side</label>
                                        <input type="number" class="form-control" id="task-name"
                                            placeholder="Apply Trim to the Bottom side" formControlName="y2">
                                    </div>
                                </div>
                                <div formGroupName="finish" class="row">
                                    <div class="card-title my-2">
                                        Finish
                                    </div>
                                    <div class="col-xl-3">
                                        <label class="form-label my-2">Apply finish to the Top side</label>
                                        <input type="text" class="form-control" id="task-name"
                                            placeholder="Apply finish to the A side" formControlName="a">
                                    </div>
                                    <div class="col-xl-3">
                                        <label class="form-label my-2">Apply finish to the Bottom side</label>
                                        <input type="text" class="form-control" id="task-name"
                                            placeholder="Apply finish to the B side" formControlName="b">
                                    </div>
                                </div>
                                <div class="col-xl-3">
                                    <label class="form-label my-2">orientationLock</label>
                                    <ng-select [items]="orientationLock" bindLabel="name" bindValue="name"
                                        placeholder="Select an option" formControlName="orientationLock">
                                    </ng-select>
                                </div>
                                <div class="col-xl-3  col-auto">
                                    <label for="contact-address-address" class="form-label">Notes</label>
                                    <textarea class="form-control" id="contact-address-address" rows="1"
                                        placeholder="Notes" formControlName="notes"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-xl-3">
                                <label class="form-label my-2">webhook</label>
                                <input type="text" class="form-control" id="task-name" placeholder="webhook"
                                    formControlName="webhook">
                            </div>
                        </div>
                        <!-- <button type="button" (click)="prevStep(2)">Back</button>
                        <a href="javascript:void(0);" download class="btn btn-danger ms-3 me-3"
                            (click)="downloadOptimizerFile()" *ngIf="optimizeId>0">
                            <i class="bi bi-file-pdf-fill"></i> Download PDF
                        </a> -->
                        <button type="submit" data-bs-toggle="modal"
                        data-bs-target="#exampleModalLg" (click)="openLg1(content4)">Submit</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="exampleModalScrollable345" tabindex="-1" aria-labelledby="exampleModalScrollable345"
    data-bs-keyboard="false" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <ng-template #content4 let-modal>
                <form>
                    <div class="modal-header justify-content-center">
                        <h6 class="modal-title" id="staticBackdropLabel3">Adonai Information </h6>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                            (click)="modal.dismiss('Cross click')" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-xl-12 col-lg-12 col-md-12">
                                <label for="contact-phone" class="form-label">id</label>
                                <input type="number" class="form-control" id="bladeWidth"
                                formControlName="id" placeholder="Id">
                            </div>
                            <div class="col-xl-12 col-lg-12 col-md-12">
                                <label for="contact-phone" class="form-label">type</label>
                                <ng-select formControlName="type" [items]="type" bindLabel="name"
                                    bindValue="designId" placeholder="Select type">
                                </ng-select>
                            </div>
                            <div class="col-xl-12 col-lg-12 col-md-12">
                                <label for="contact-phone" class="form-label">units</label>
                                <ng-select formControlName="units" [items]="units" bindLabel="name"
                                    bindValue="designId" placeholder="Select units">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-secondary">Update</button>
                        <button type="button" class="btn btn-danger" (click)="modal.close('Close click')"
                            data-bs-dismiss="modal">Close</button>
                    </div>
                </form>
            </ng-template>
        </div>
    </div>
</div>
