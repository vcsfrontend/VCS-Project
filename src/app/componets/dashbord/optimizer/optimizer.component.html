<ng-template #Content id="addedge" let-modal>
    <div class="modal-content">
        <div class="modal-header">
            <h6 class="modal-title" id="mail-ComposeLabel">Panel Details</h6>
            <button type="button" class="btn-close" data-bs-dismiss="modal" (click)="modal.close('Cross click')"
                aria-label="Close"></button>
        </div>
        <div class="modal-body px-4">
            <div class="col-xl-8">
                <div class="row ">
                    <div class="col-xl-4 col-auto">
                        <label for="task-name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="task-name" placeholder="Name">
                    </div>
                    <div class="col-xl-4 col-auto">
                        <label for="task-name" class="form-label">Length</label>
                        <input type="text" class="form-control" id="task-name" placeholder="0 mm">
                    </div>
                    <div class="col-xl-4 col-auto">
                        <label for="task-name" class="form-label">Width</label>
                        <input type="text" class="form-control" id="task-name" placeholder="0 mm">
                    </div>
                    <div class="col-xl-4 col-auto">
                        <label for="task-name" class="form-label">Quantity</label>
                        <input type="text" class="form-control" id="task-name" placeholder="Quantity">
                    </div>
                    <div class="col-xl-4 col-auto">
                        <label class="form-label">Panel Material</label>
                        <ng-select formControlName="stage" [items]="panelList" bindLabel="name" bindValue="name"
                            placeholder="Select an option">
                        </ng-select>
                    </div>
                    <div class="col-xl-4">
                        <label class="form-label">Machining Charge</label>
                        <ng-select formControlName="stage" [items]="panelList" bindLabel="name" bindValue="name"
                            placeholder="Select an option">
                        </ng-select>
                    </div>
                </div>
            </div>
        </div>

                    <ng-select [items]="autoAdd" bindLabel="name" bindValue="name" placeholder="Select an option"
                        formControlName="autoAdd">
                    </ng-select>
                </div>
                <div class="col-xl-3">
                    <label class="form-label my-2">Grain</label>
                    <ng-select [items]="Grain" bindLabel="name" bindValue="name" placeholder="string"
                        formControlName="grain">
                    </ng-select>
                </div>
                <div formGroupName="trim" class="row">
                    <div class="card-title my-2">
                        Trim
                    </div>
                    <div class="col-xl-4">
                        <label class="form-label my-2">x1</label>
                        <input type="number" class="form-control" id="x1" placeholder="number" formControlName="x1">
                    </div>
                    <div class="col-xl-4">
                        <label class="form-label my-2">x2</label>
                        <input type="number" class="form-control" id="x2" placeholder="number" formControlName="x2">
                    </div>
                    <div class="col-xl-6">
                        <label class="form-label my-2">y1</label>
                        <input type="number" class="form-control" id="y1" placeholder="number" formControlName="y1">

                    </div>
                    <div class="col-xl-6">
                        <label class="form-label my-2">y2</label>
                        <input type="number" class="form-control" id="y2" placeholder="number" formControlName="y2">

                    </div>
                </div>
                <div class="col-xl-4">
                    <label class="form-label my-2">allowExactFitShapes</label>
                    <ng-select [items]="allowExactFitShapes" bindLabel="name" bindValue="name" placeholder="string"
                        formControlName="allowExactFitShapes">
                    </ng-select>
                </div>
                <div class="col-xl-4">
                    <label class="form-label my-2">cost</label>
                    <input type="number" class="form-control" id="cost" placeholder="Cost" formControlName="cost">
                </div>
                <div class="col-xl-4">
                    <label class="form-label my-2">notes</label>
                    <input type="text" class="form-control" id="notes" placeholder="notes" formControlName="notes">
                </div>

            </div>
        </div>
        
        <button type="button" (click)="prevStep(1)">Back</button>
        <button type="button" (click)="nextStep(3)">Next</button>
        </div>

        <!-- Step 3 -->
        <div *ngIf="stepIndex === 3">
        <h3>Step 3: Parts</h3>
        <div formArrayName="parts">
            <div *ngFor="let partGroup of parts.controls; let i = index" [formGroupName]="i" class="row">
                <div class="col-xl-3 col-auto">
                    <label for="task-name" class="form-label my-2">Name</label>
                    <input type="text" class="form-control" id="task-name" placeholder="Name" formControlName="name">
                </div>
                <div class="col-xl-3 col-auto">
                    <label for="task-name" class="form-label my-2">Length</label>
                    <input type="number" class="form-control" id="task-name" placeholder="length" formControlName="l">
                </div>
                <div class="col-xl-3 col-auto">
                    <label for="task-name" class="form-label my-2">Width</label>
                    <input type="number" class="form-control" id="task-name" placeholder="Width" formControlName="w">
                </div>

                <div class="col-xl-3 col-auto">
                    <label for="task-name" class="form-label my-2">Thickness</label>
                    <input type="number" class="form-control" id="task-name" placeholder="number" formControlName="t">
                </div>
                <div class="col-xl-3 col-auto">
                    <label for="task-name" class="form-label my-2">material</label>
                    <input type="text" class="form-control" id="task-name" placeholder="material"
                        formControlName="material">
                </div>
                <div class="col-xl-3 col-auto">
                    <label for="task-name" class="form-label my-2">q</label>
                    <input type="number" class="form-control" id="task-name" placeholder="q" formControlName="q">
                </div>
                <div formGroupName="banding" class="row">
                    <div class="card-title my-2">
                        banding
                    </div>
                    <div class="col-xl-4">
                        <label class="form-label my-2">x1</label>
                        <ng-select [items]="X1" bindLabel="name" bindValue="name" placeholder="string"
                            formControlName="x1">
                        </ng-select>
                    </div>
                    <div class="col-xl-3 col-auto">
                        <label for="task-name" class="form-label my-2">X2</label>
                        <ng-select [items]="X2" bindLabel="name" bindValue="name" placeholder="string"
                            formControlName="x2">
                        </ng-select>
                    </div>
                    <div class="col-xl-3 col-auto">
                        <label for="task-name" class="form-label my-2">Y1</label>
                        <ng-select [items]="Y1" bindLabel="name" bindValue="name" placeholder="string"
                            formControlName="y1">
                        </ng-select>
                    </div>
                    <div class="col-xl-3 col-auto">
                        <label for="task-name" class="form-label my-2">Y2</label>
                        <ng-select [items]="Y2" bindLabel="name" bindValue="name" placeholder="string"
                            formControlName="y2">
                        </ng-select>
                    </div>
                </div>
                <div formGroupName="trim" class="row">
                    <div class="card-title my-2">
                        trim
                    </div>
                    <div class="col-xl-3 col-auto">
                        <label for="task-name" class="form-label my-2">x1</label>
                        <input type="number" class="form-control" id="task-name" placeholder="x1" formControlName="x1">
                    </div>
                    <div class="col-xl-3 col-auto">
                        <label for="task-name" class="form-label my-2">x2</label>
                        <input type="number" class="form-control" id="task-name" placeholder="x2" formControlName="x2">
                    </div>
                    <div class="col-xl-3 col-auto">
                        <label for="task-name" class="form-label my-2">y1</label>
                        <input type="number" class="form-control" id="task-name" placeholder="y1" formControlName="y1">
                    </div>
                    <div class="col-xl-3 col-auto">
                        <label for="task-name" class="form-label my-2">y2</label>
                        <input type="number" class="form-control" id="task-name" placeholder="y2" formControlName="y2">
                    </div>
                </div>
                <div formGroupName="finish" class="row">
                    <div class="card-title my-2">
                        Finish
                    </div>
                    <div class="col-xl-3">
                        <label class="form-label my-2">a</label>
                        <input type="text" class="form-control" id="task-name" placeholder="a" formControlName="a">
                    </div>
                    <div class="col-xl-3">
                        <label class="form-label my-2">b</label>
                        <input type="text" class="form-control" id="task-name" placeholder="b" formControlName="b">
                    </div>
                </div>
                <div class="col-xl-3">
                    <label class="form-label my-2">orientationLock</label>
                    <ng-select [items]="orientationLock" bindLabel="name" bindValue="name"
                        placeholder="Select an option" formControlName="orientationLock">
                    </ng-select>
                </div>
                <div class="col-xl-3  col-auto">
                    <label for="contact-address-address" class="form-label">Notes</label>
                    <textarea class="form-control" id="contact-address-address" rows="1" placeholder="Notes"
                        formControlName="notes"></textarea>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-xl-3">
                <label class="form-label my-2">webhook</label>
                <input type="text" class="form-control" id="task-name" placeholder="webhook" formControlName="webhook">
            </div>
        </div>
        <button type="button" (click)="prevStep(2)">Back</button>
        <a href="javascript:void(0);" download class="btn btn-danger mt-3 me-3" (click)="downloadOptimizerFile()"
            *ngIf="optimizeId>0">
            <i class="bi bi-file-pdf-fill"></i> Download PDF
        </a>
        <button type="submit">Submit</button>
        </div>

    </form>
</div>
