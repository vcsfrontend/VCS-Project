<div class="col-lg-12 bg-white">
    <full-calendar [options]="calendarOptions">
        <ng-template #eventContent let-arg>
            <div class="custom-event" (click)="open(content1)">
                <strong >{{ arg.event.title }}</strong>
            </div>
        </ng-template>
    </full-calendar>
</div>

<ng-template #content1 let-modal>
  <div class="modal-header justify-content-center">
    <h6 class="modal-title" id="staticBackdropLabel3">Book a Demo</h6>
    <button type="button" class="btn-close" data-bs-dismiss="modal" (click)="modal.dismiss('Cross click')"
      aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="appointmentForm" (ngSubmit)="getAppointment(modal)">
      <div class="col-xl-12">
        <div class="row gy-2">
          <div class="col-xl-6">
            <label for="name" class="form-label">Start Date</label>
            <input type="datetime-local" class="form-control" id="name" formControlName="startDate"
              placeholder="Enter Name">
          </div>
          <div class="col-xl-6">
            <label for="description" class="form-label">End Date</label>
            <input type="datetime-local" class="form-control" id="name" placeholder="Enter your endDate"
              formControlName="endDate">
          </div>
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button type="submit" class="btn btn-primary"> Submit</button>
    <button type="button" class="btn btn-danger" (click)="modal.close('Close click')"
      data-bs-dismiss="modal">Close</button>
  </div>
</ng-template>
